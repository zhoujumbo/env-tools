[package]
name = "envdesk"
version = "0.1.0"
description = "Windows desktop environment panel"
authors = ["kxzf"]
edition = "2021"

[lib]
name = "envdesk_lib"
# Windows 桌面只需要 rlib；cdylib 会让 GNU ld 导出 10 万+ 符号，触发
# "export ordinal too large"（PE ordinal 上限 65535）。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
winreg = "0.52"
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
walkdir = "2"
ureq = { version = "2.12", default-features = false, features = ["tls", "json", "socks-proxy"] }
junction = "1.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
